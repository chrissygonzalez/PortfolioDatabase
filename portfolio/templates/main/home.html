{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
    <h1>Welcome {{username}} {{account_type}} {{data}}</h1>
    {% if data is defined and data.prof_id is not none %}
        <button>Edit Profile</button>
    {% else %}
        <a href="{{ url_for('profile.create') }}">
            <button type="button">Create Profile</button>
        </a>
    {% endif %}
{% endblock %}
