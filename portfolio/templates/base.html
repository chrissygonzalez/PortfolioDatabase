<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
    <header>
        Portfolio App
        {% if session.username %}
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        {% else %}
        	<a href="{{ url_for('auth.login') }}" class="{{ 'active' if request.endpoint == 'auth.login' else '' }}">Login</a>
            <a href="{{ url_for('auth.register') }}" class="{{ 'active' if request.endpoint == 'auth.register' else '' }}">Register</a>
        {% endif %}
    </header>
    <div id="content">{% block content %}{% endblock %}</div>
</body>
</html>
