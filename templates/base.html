<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
    <header>
        Portfolio App
        {% if data is defined and data.account_id is not none %}
            <a href="/logout">Logout</a>
        {% else %}
        	<a href="/login" class="{{ 'active' if request.endpoint == 'login' else '' }}">Login</a>
            <a href="/register" class="{{ 'active' if request.endpoint == 'register' else '' }}">Register</a>
        {% endif %}
    </header>
    <div id="content">{% block content %}{% endblock %}</div>
</body>
</html>
